<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1d1f">
<title>SONRY · FOTOMETRÍA</title>
<style>
:root{color-scheme:dark;--bg:#111315;--panel:#2a2d30;--panel2:#4a4f55;--line:#24272a;--text:#f4f5f7;--muted:#b8bdc3;--accent:#b8bdc3;--soft:#34383d;--active:#4a4f55;--preview:#202428}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:540px;margin:auto;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 28px}.brand{font-size:21px;font-weight:650;letter-spacing:.04em}.subtitle{font-size:12px;color:var(--muted);margin-top:4px}.iconbtn{border:0;background:none;color:var(--text);font-size:25px;padding:8px}
.photo{border:1px solid #3b3b3e;background:#252527;border-radius:14px;overflow:hidden;margin-bottom:16px}.preview{height:180px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#39393c,#202022);position:relative;overflow:hidden}.preview video,.preview img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;color:#b8b8bb;padding:20px}.placeholder .camera{font-size:35px;display:block;margin-bottom:8px}.photoactions{display:flex;gap:8px;padding:10px}.photoactions button{flex:1}
button,select{font:inherit;color:var(--text);border:1px solid #525256;background:#38383b;border-radius:10px;padding:12px}button{cursor:pointer}button:active{transform:scale(.99)}.primary{background:#555558;border-color:#77777a;font-weight:650}.outline{background:transparent;border-color:#454549}
.wheels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:15px;overflow:hidden;background:#202022;border:1px solid #252527}
.wheel{background:linear-gradient(#343436,#303032);min-width:0;position:relative;text-align:center}.wlabel{height:52px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;background:#262628}.roller{height:324px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;padding:135px 0;position:relative}.roller::-webkit-scrollbar{display:none}.option{height:54px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:clamp(17px,4.6vw,25px);color:#e6e6e7;user-select:none;cursor:pointer;white-space:nowrap}.option.active{background:#505053;font-weight:700;color:white}.selectionline{position:absolute;left:0;right:0;top:187px;height:54px;border-top:1px solid #202022;border-bottom:1px solid #202022;pointer-events:none}
.lockrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 18px}
.lockrow button{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:42px;padding:7px 5px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:650;transition:background .18s,border-color .18s,color .18s,opacity .18s}
.lockrow button .lockicon{font-size:18px;line-height:1;filter:grayscale(1);opacity:.68}
.lockrow button .lockstate{font-size:10px;letter-spacing:.04em}
.lockrow button.locked{color:#fff;background:var(--active);border-color:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
.lockrow button.locked .lockicon{opacity:1}
.lockrow button:not(.locked){color:var(--muted);background:var(--soft);border-color:var(--line);opacity:.78}
.lockrow button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:380px){.lockrow button{gap:4px;font-size:11px}.lockrow button .lockicon{font-size:16px}}
.current{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:13px 2px 18px;font-size:12px;color:var(--muted)}.current strong{color:var(--text);font-size:13px;text-align:right}
.mainactions{display:grid;gap:10px;margin-top:22px}.mainactions button{width:100%;border-radius:30px;min-height:56px;font-size:18px}.result{margin-top:18px;border:1px solid #39393c;border-radius:14px;padding:15px;background:#262628}.resulthead{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:11px;color:#bdbdc0;border:1px solid #555559;padding:5px 8px;border-radius:20px}.big{font-size:27px;font-weight:700;margin:12px 0 4px}.small{font-size:12px;line-height:1.5;color:var(--muted)}.notice{margin-top:12px;font-size:11px;line-height:1.5;color:#a8a8ab}
.hidden{display:none!important}.file-picker{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;clip-path:inset(50%);left:0;top:0}.manual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.manual label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.manual select{width:100%}

header{position:relative;justify-content:center;text-align:center;margin-bottom:22px;min-height:78px}
.brandblock{display:flex;flex-direction:column;align-items:center;gap:2px}
.brandlogo{display:block;width:118px;height:auto;max-height:38px;object-fit:contain}
.brand{font-size:20px;font-weight:700;letter-spacing:.12em}
.subtitle{font-size:12px}
.iconbtn{position:absolute;right:0;top:8px}
.palettebar{display:flex;align-items:center;gap:8px;margin:-8px 0 16px}
.palettebar label{font-size:12px;color:var(--muted);white-space:nowrap}
.palettebar select{width:100%;min-width:0;padding:10px 12px;background:var(--panel);border-color:var(--panel2)}
body[data-palette="pink"]{--bg:#5b3a4e;--panel:#e47a9d;--panel2:#f3a6bd;--line:#f7c6d0;--text:#23151c;--muted:#513440;--accent:#7c304f;--soft:#f7c6d0;--active:#d95f88;--preview:#f3a6bd;color-scheme:light}
body[data-palette="green"]{--bg:#344e41;--panel:#588157;--panel2:#a3b18a;--line:#dad7cd;--text:#ffffff;--muted:#ffffff;--accent:#a3b18a;--soft:#3a5a40;--active:#588157;--preview:#3a5a40;color-scheme:dark}
body[data-palette="mono"]{--bg:#111315;--panel:#2a2d30;--panel2:#4a4f55;--line:#24272a;--text:#f4f5f7;--muted:#b8bdc3;--accent:#b8bdc3;--soft:#34383d;--active:#4a4f55;--preview:#202428;color-scheme:dark}
.photo{background:var(--panel);border-color:var(--panel2)}
.preview{background:linear-gradient(135deg,var(--panel2),var(--preview))}
button,select{color:var(--text);border-color:var(--panel2);background:var(--soft)}
.primary{background:var(--active);border-color:var(--panel2);color:var(--text)}
.outline{background:transparent;border-color:var(--panel2)}
.wheels{background:var(--bg);border-color:var(--line)}
.wheel{background:linear-gradient(var(--panel),var(--soft))}
.wlabel{background:var(--panel)}
.option{color:var(--text);-webkit-text-fill-color:var(--text);text-shadow:0 1px 2px rgba(0,0,0,.18)}
.option.active{background:var(--active);color:#fff;-webkit-text-fill-color:#fff}
.subtitle{color:var(--text)}
.placeholder{color:#fff}
.placeholder .subtitle{color:#fff;font-weight:500}
.wlabel{color:#fff}
body[data-palette="green"] .roller .option{color:#fff;-webkit-text-fill-color:#fff}
body[data-palette="green"] .wlabel{color:#fff}
body[data-palette="green"] .current,body[data-palette="green"] .notice,body[data-palette="green"] .small{color:#fff}
.selectionline{border-color:var(--line)}
.result{background:var(--panel);border-color:var(--panel2)}
.badge{color:var(--text);border-color:var(--panel2)}
@media(max-height:760px){.roller{height:270px;padding:108px 0}.selectionline{top:160px}.option{height:54px}}

/* Ajustes de legibilidad y selector centrado */
header{color:#fff}
.brand{color:#fff}
header .subtitle{color:#fff!important}
.placeholder,.placeholder strong,.placeholder .subtitle,.placeholder .camera{color:#fff!important;-webkit-text-fill-color:#fff}
.wlabel{color:#fff!important;-webkit-text-fill-color:#fff}
.option,.option.active{color:#fff!important;-webkit-text-fill-color:#fff}
.palettebar{display:flex;justify-content:center;align-items:center;width:100%;margin:0 auto 16px;padding:0}
.palettechoices{display:flex;justify-content:center;align-items:center;gap:14px;width:100%}
.palettechip{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:50%;font-size:25px;line-height:1;background:transparent;border:2px solid transparent;cursor:pointer}
.palettechip[aria-pressed="true"],.palettechip.active{border-color:#fff;background:rgba(255,255,255,.12);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
body[data-palette="pink"]{--text:#fff;--muted:#fff;color:#fff}
body[data-palette="pink"] .subtitle,
body[data-palette="pink"] .small,
body[data-palette="pink"] .notice,
body[data-palette="pink"] .palettecurrent,
body[data-palette="pink"] .placeholder,
body[data-palette="pink"] .placeholder strong,
body[data-palette="pink"] .placeholder .subtitle{color:#fff!important;-webkit-text-fill-color:#fff}

.site-footer{width:100%;text-align:center;padding:24px 16px 30px;margin-top:28px;border-top:1px solid var(--line);box-sizing:border-box}
.site-footer a{color:var(--text);text-decoration:none;font-size:13px;letter-spacing:.12em;opacity:.9}
.site-footer a:hover{opacity:1;text-decoration:underline}
@media(max-width:600px){.site-footer{margin-top:20px;padding:20px 12px 26px}}
</style>

<style>
.home-screen{min-height:100vh;min-height:100dvh;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;padding:28px 22px;box-sizing:border-box}
.home-center{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px}
.home-logo{display:block;width:min(88%,520px);height:auto;object-fit:contain}
.home-start{width:min(100%,440px);min-height:58px;padding:16px 20px;border:1px solid #fff;border-radius:2px;background:#fff;color:#000;font-size:clamp(14px,3.7vw,17px);font-weight:800;letter-spacing:.07em;cursor:pointer}
.home-start:active{transform:scale(.99)}
.home-url{color:#fff;text-decoration:none;font-size:clamp(11px,3vw,14px);letter-spacing:.17em;line-height:1.8}
.photometer-app{display:none}
body.photometer-open{background:var(--bg)}
body.photometer-open .home-screen{display:none}
body.photometer-open .photometer-app{display:block}
@media(min-width:700px){.home-center{gap:34px}.home-logo{width:min(82%,600px)}}
</style>

<style id="sonry-image-cover">
html,body{margin:0;min-height:100%;background:#000}
.home-screen{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100vh;height:100dvh;
  background:#000;overflow:hidden;padding:0;margin:0
}
.cover-frame{
  position:relative;
  width:min(100vw,177.8646vh);
  width:min(100vw,177.8646dvh);
  aspect-ratio:1366 / 768;
  flex:none;overflow:hidden
}
.cover-image{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
.cover-start{
  position:absolute;left:44.1%;top:56.2%;
  transform:translate(-50%,-50%);
  min-width:0;min-height:0;
  padding:5px 13px;
  border:1px solid #858585;border-radius:0;
  background:#bdbdbd;color:#111;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(8px,0.75vw,11px);font-weight:700;
  line-height:1.1;letter-spacing:.07em;
  cursor:pointer;box-shadow:none
}
.cover-start:active{transform:translate(-50%,-50%) scale(.98)}
.photometer-app{display:none}
body.photometer-open .home-screen{display:none}
body.photometer-open .photometer-app{display:block}
@media(max-width:600px){
 .cover-start{padding:5px 11px;font-size:9px}
}
</style>

<style id="sonry-intro-styles">
.sonry-intro{
  position:fixed;inset:0;z-index:20000;
  display:flex;align-items:center;justify-content:center;
  background:#000;opacity:1;visibility:visible;
  animation:sonryIntroFade 250ms ease-in-out 3.25s forwards;
  pointer-events:none;
}
.sonry-intro-logo{
  display:block;width:clamp(155px, 43vw, 285px);max-width:68vw;height:auto;
  object-fit:contain;opacity:0;
  animation:sonryLogoGrow 3.25s cubic-bezier(.2,.75,.25,1) 150ms forwards;
}
@keyframes sonryLogoGrow{
  0%{opacity:0;transform:scale(.48)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes sonryIntroFade{
  0%{opacity:1;visibility:visible}
  99%{opacity:0;visibility:visible}
  100%{opacity:0;visibility:hidden}
}
@media(min-width:700px){
  .sonry-intro-logo{width:clamp(190px, 23vw, 300px)}
}
@media(prefers-reduced-motion:reduce){
  .sonry-intro-logo{animation:sonryLogoGrow 3.25s ease 150ms forwards}
  .sonry-intro{animation:sonryIntroFade 250ms ease-in-out 1.25s forwards}
}
</style>

<style id="sonry-skip-home-cover">
#homeScreen.home-screen{display:none!important}
body:not(.photometer-open) .photometer-app{display:none!important}
body.photometer-open .photometer-app{display:block!important}
</style>
