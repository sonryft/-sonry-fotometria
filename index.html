<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
<script>
(()=> {
 const $=id=>document.getElementById(id);
 const paletteNames={pink:'Rosado',green:'Verde',mono:'Negro y blanco'};
 const paletteButtons=[...document.querySelectorAll('.palettechip')];
 const storedPalette=localStorage.getItem('sonry-fotometria-palette');
 const savedPalette=['pink','green','mono'].includes(storedPalette)?storedPalette:'mono';
 function setPalette(value){
   if(!['pink','green','mono'].includes(value)) value='mono';
   document.body.dataset.palette=value;
   localStorage.setItem('sonry-fotometria-palette',value);
   paletteButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.choice===value)));
   const current=$('paletteCurrent'); if(current) current.textContent=paletteNames[value]||paletteNames.mono;
 }
 paletteButtons.forEach(button=>button.addEventListener('click',()=>setPalette(button.dataset.choice)));
 setPalette(savedPalette);
 const stops={time:['30 s','25 s','20 s','15 s','13 s','10 s','8 s','6 s','5 s','4 s','3.2 s','2.5 s','2 s','1.6 s','1.3 s','1 s','0.8 s','0.6 s','0.5 s','0.4 s','1/3 s','1/4 s','1/5 s','1/6 s','1/8 s','1/10 s','1/13 s','1/15 s','1/20 s','1/25 s','1/30 s','1/40 s','1/50 s','1/60 s','1/80 s','1/100 s','1/125 s','1/160 s','1/200 s','1/250 s','1/320 s','1/400 s','1/500 s','1/640 s','1/800 s','1/1000 s','1/1250 s','1/1600 s','1/2000 s','1/2500 s','1/3200 s','1/4000 s','1/5000 s','1/6400 s','1/8000 s'],
 ap:['1','1.1','1.2','1.4','1.6','1.8','2','2.2','2.5','2.8','3.2','3.5','4','4.5','5','5.6','6.3','7.1','8','9','10','11','13','14','16','18','20','22'],
 iso:['50','64','80','100','125','160','200','250','320','400','500','640','800','1000','1250','1600','2000','2500','3200','4000','5000','6400','8000','10000','12800','16000','20000','25600','32000','40000','51200','64000','80000','102400','204800']
 };
 const state={time:'1/125 s',ap:'4',iso:'100'};
 const locked={time:false,ap:false,iso:true};
 let baseline=null, currentPhotoUrl=null;
 const wheels={time:$('timeWheel'),ap:$('apWheel'),iso:$('isoWheel')};
 function seconds(v){if(v.endsWith(' s')){let n=v.replace(' s','');if(n.includes('/'))return 1/Number(n.split('/')[1]);return Number(n)}return 1/Number(v.split('/')[1])}
 function fmtTime(v){return v.replace(' s','')+(v.includes('/')?' s':' s')}
 function ev(settings){return Math.log2((Number(settings.ap)**2/seconds(settings.time))*100/Number(settings.iso))}
 function makeWheel(key){const el=wheels[key];el.innerHTML='';stops[key].forEach(v=>{const d=document.createElement('div');d.className='option';d.textContent=key==='time'?v.replace(' s','″'):(key==='ap'?'f/'+v:v);d.dataset.value=v;d.addEventListener('click',()=>{state[key]=v;updateFromChange(key);Object.keys(wheels).forEach(renderWheel);sync()});el.appendChild(d)});let scrollTimer;el.addEventListener('scroll',()=>{const opts=stops[key];const centerY=el.getBoundingClientRect().top+el.clientHeight/2;let nearestOption=null,nearestDistance=Infinity;el.querySelectorAll('.option').forEach(node=>{const rect=node.getBoundingClientRect();const distance=Math.abs((rect.top+rect.height/2)-centerY);if(distance<nearestDistance){nearestDistance=distance;nearestOption=node}});const v=nearestOption?.dataset.value;if(v&&v!==state[key]){state[key]=v;updateFromChange(key);Object.keys(wheels).forEach(highlight);sync();Object.keys(wheels).filter(k=>k!==key).forEach(k=>renderWheel(k))}clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const selected=el.querySelector(`[data-value="${CSS.escape(state[key])}"]`);if(selected){const desired=selected.offsetTop-(el.clientHeight-selected.offsetHeight)/2;el.scrollTo({top:desired,behavior:'smooth'})}},140);},{passive:true});el.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();let i=stops[key].indexOf(state[key]);i=Math.max(0,Math.min(stops[key].length-1,i+(e.key==='ArrowDown'?1:-1)));state[key]=stops[key][i];updateFromChange(key);Object.keys(wheels).forEach(renderWheel);sync()});}
 function highlight(key){wheels[key].querySelectorAll('.option').forEach(d=>d.classList.toggle('active',d.dataset.value===state[key]))}
 function renderWheel(key){highlight(key);const el=wheels[key],item=el.querySelector(`[data-value="${CSS.escape(state[key])}"]`);if(item){const target=item.offsetTop-(el.clientHeight-item.offsetHeight)/2;el.scrollTop=target;}}
 function updateFromChange(changed){
   if(!baseline)return;
   const candidates = {
     ap:   ['time','iso'],
     iso:  ['time','ap'],
     time: ['ap','iso']
   };
   const target = candidates[changed].find(k => !locked[k]);
   if(!target)return;

   const targetEV = ev(baseline);
   if(target==='time'){
     const requiredSeconds = (Number(state.ap)**2 * 100) / (Number(state.iso) * Math.pow(2,targetEV));
     state.time = nearest('time', requiredSeconds);
   }else if(target==='ap'){
     const requiredF = Math.sqrt(Math.pow(2,targetEV) * Number(state.iso) * seconds(state.time) / 100);
     state.ap = nearest('ap', requiredF);
   }else if(target==='iso'){
     const requiredISO = (Number(state.ap)**2 / seconds(state.time)) * 100 / Math.pow(2,targetEV);
     state.iso = nearest('iso', requiredISO);
   }
 }
 function nearest(key,val){return stops[key].reduce((best,v)=>{const n=key==='time'?seconds(v):Number(v);return Math.abs(Math.log2(n/val))<Math.abs(Math.log2((key==='time'?seconds(best):Number(best))/val))?v:best},stops[key][0])}
 function sync(){ $('currentSettings').textContent=state.time+' · f/'+state.ap+' · ISO '+state.iso;Object.keys(wheels).forEach(k=>highlight(k));if(baseline){$('resultTime').textContent=state.time;$('resultText').textContent='Exposición equivalente a la referencia, ajustada a los valores seleccionados. La compensación se redondea a tercios de paso.'}else{$('resultText').textContent='Primero pulsa “Tomar lectura” o usa “Revisar lectura” para fijar una referencia. Después, al cambiar ISO, diafragma o velocidad, otro parámetro se ajustará automáticamente.'}}
 function lockUI(key){const button=$('lock'+key[0].toUpperCase()+key.slice(1));locked[key]=!locked[key];button.classList.toggle('locked',locked[key]);button.setAttribute('aria-pressed',String(locked[key]));button.setAttribute('aria-label',(key==='time'?'Velocidad':key==='ap'?'Diafragma':'ISO')+(locked[key]?': bloqueado':': desbloqueado'));button.querySelector('.lockicon').textContent=locked[key]?'🔒':'🔓';button.querySelector('.lockstate').textContent=locked[key]?'FIJO':'LIBRE'}
 $('lockTime').addEventListener('click',()=>lockUI('time'));$('lockAp').addEventListener('click',()=>lockUI('ap'));$('lockIso').addEventListener('click',()=>lockUI('iso'));
 function setSelect(id,arr,val){$(id).innerHTML=arr.map(v=>`<option ${v===val?'selected':''}>${v}</option>`).join('')}
 setSelect('refTime',stops.time,state.time);setSelect('refAp',stops.ap,state.ap);setSelect('refIso',stops.iso,state.iso);
 $('applyRef').addEventListener('click',()=>{baseline={time:$('refTime').value,ap:$('refAp').value,iso:$('refIso').value};state.time=baseline.time;state.ap=baseline.ap;state.iso=baseline.iso;Object.keys(wheels).forEach(renderWheel);sync();$('readStatus').textContent='Referencia aplicada';$('resultText').textContent='Referencia establecida. Ahora cambia un parámetro: los demás se compensarán según el bloqueo.';$('manualPanel').classList.add('hidden')});$('readBtn').addEventListener('click',()=>{
   if(!baseline){$('readStatus').textContent='Sin referencia';$('resultText').textContent='Primero toma una fotografía con metadatos o usa “Revisar lectura” para introducir los parámetros manualmente.';return}
   sync();$('readStatus').textContent='Referencia activa';
 });
 $('reviewBtn').addEventListener('click',()=>{$('manualPanel').classList.toggle('hidden')});

 // Corrección para dispositivos iOS: aseguramos la ejecución del click nativo sin bloqueos de seguridad de Safari
 $('openCamera').addEventListener('click', (e) => {
   e.preventDefault();
   $('cameraFile').click();
 });
 $('upload').addEventListener('click', (e) => {
   e.preventDefault();
   $('galleryFile').click();
 });

 async function processSelectedPhoto(input){
   const f=input.files && input.files[0]; if(!f)return;
   if(currentPhotoUrl)URL.revokeObjectURL(currentPhotoUrl);
   currentPhotoUrl=URL.createObjectURL(f);
   $('photo').src=currentPhotoUrl;$('photo').classList.remove('hidden');$('video').classList.add('hidden');$('placeholder').classList.add('hidden');
   $('readStatus').textContent='Leyendo metadatos…';$('liveBrightness').textContent=f.name;
   try{
     let meta=null;
     if(window.exifr && typeof window.exifr.parse==='function'){
       // Se añade una tolerancia mayor para lectura asíncrona segura en Safari
       meta=await window.exifr.parse(f,{
          tiff:true, exif:true, iptc:false, icc:false, xmp:false, gps:false, translateValues:true
        });
     }
     if(!meta) meta={};
     const exp=Number(meta.ExposureTime ?? (meta.ShutterSpeedValue != null ? Math.pow(2,-Number(meta.ShutterSpeedValue)) : NaN));
     const fnum=Number(meta.FNumber ?? (meta.ApertureValue != null ? Math.pow(2,Number(meta.ApertureValue)/2) : NaN));
     const isoRaw=Array.isArray(meta.ISO)?meta.ISO[0]:meta.ISO;
     const isoNum=Number(isoRaw);
     const timeValue=Number.isFinite(exp)&&exp>0?nearest('time',exp):null;
     const apValue=Number.isFinite(fnum)&&fnum>0?nearest('ap',fnum):null;
     const isoValue=Number.isFinite(isoNum)&&isoNum>0?nearest('iso',isoNum):null;
     const found=[];
     if(timeValue){state.time=timeValue;found.push('velocidad '+(meta.ExposureTime<1?'1/'+Math.round(1/Number(meta.ExposureTime))+' s':meta.ExposureTime+' s'));}
     if(apValue){state.ap=apValue;found.push('diafragma f/'+meta.FNumber);}
     if(isoValue){state.iso=isoValue;found.push('ISO '+isoNum);}
     if(timeValue&&apValue&&isoValue){
       baseline={time:timeValue,ap:apValue,iso:isoValue};
       Object.keys(wheels).forEach(renderWheel);sync();
       $('readStatus').textContent='EXIF leído';
       $('resultTime').textContent=state.time+' · f/'+state.ap+' · ISO '+state.iso;
       const camera=[meta.Make,meta.Model].filter(Boolean).join(' ');
       const focal=Number(meta.FocalLength)>0?' · '+meta.FocalLength+' mm':'';
       $('resultText').textContent='Parámetros originales cargados: '+found.join(' · ')+'. '+(camera?'Cámara: '+camera+'. ':'')+(meta.DateTimeOriginal?'Fecha: '+meta.DateTimeOriginal+'. ':'')+(focal?'Distancia focal: '+meta.FocalLength+' mm.':'')+' Ahora modifica las ruedas y bloquea los parámetros que quieras conservar.';
       $('liveBrightness').textContent='Metadatos encontrados en la fotografía.';
     } else {
       if(timeValue||apValue||isoValue){baseline={time:state.time,ap:state.ap,iso:state.iso};Object.keys(wheels).forEach(renderWheel);sync();}
       $('readStatus').textContent='EXIF incompleto';
       $('resultTime').textContent=[timeValue\vert{}\vert{}'—',apValue?'f/'+apValue:'—',isoValue?'ISO '+isoValue:'—'].join(' · ');$('resultText').textContent='No se encontraron todos los datos de exposición en este archivo. '+(input.id==='cameraFile'?'En iPhone, la cámara del navegador a veces comprime la imagen y omite los metadatos EXIF. Prueba seleccionando la foto directamente desde tu fototeca con "Elegir foto". ':'')+(found.length?'Datos encontrados: '+found.join(', ')+'. ':'')+'También puedes introducir los valores que falten en “Revisar lectura”.';
       $('liveBrightness').textContent='EXIF disponibles: '+(found.length?found.join(' · '):'ninguno de los parámetros principales');
     }
   }catch(err){
     $('readStatus').textContent='No se pudieron leer los EXIF';$('resultTime').textContent='—';$('resultText').textContent='La foto se cargó correctamente, pero el formato HEIC/JPEG de iOS requiere ser seleccionado desde la galería si la captura directa de Safari omitió los metadatos. Si lo prefieres, introduce los valores manualmente en “Revisar lectura”.';
     $('liveBrightness').textContent='Archivo: '+f.name;
   }
   input.value='';
 }
 $('cameraFile').addEventListener('change',()=>processSelectedPhoto($('cameraFile')));$('galleryFile').addEventListener('change',()=>processSelectedPhoto($('galleryFile')));$('startPhotometer').addEventListener('click',()=>{
   document.body.classList.add('photometer-open');
   window.scrollTo({top:0,behavior:'instant'});
 });
 Object.keys(wheels).forEach(makeWheel);requestAnimationFrame(()=>{Object.keys(wheels).forEach(k=>renderWheel(k));sync()});
})();
</script>
